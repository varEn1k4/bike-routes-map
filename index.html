<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Карта веломаршрутів</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="js/script.js" defer></script>
    <meta name="viewport" content="width=device-width" , initial-scale="1.0" />
  </head>
  <body>
    <header>
      <h1>Карта веломаршрутів</h1>
      <nav>
        <ul>
          <li><a href="#map">Карта</a></li>
          <li><a href="#routes">Маршрути</a></li>
        </ul>
      </nav>
    </header>

    <main id="app">
      <section id="map">
        <h2>Карта</h2>
        <img
          src="assets/images/test-image-1.png"
          alt="Схематична карта велосипедних маршрутів Європи"
        />
      </section>

      <section id="routes">
        <h2>Маршрути</h2>

        <div class="cards" id="routes-list">
          <route-card
            v-for="route in routesData"
            :key="route.name"
            :name="route.name"
            :length-km="route.km"
            :difficulty="route.difficulty"
            @delete-route="deleteRoute"
          ></route-card>
        </div>

        <p id="total-km"></p>
      </section>

      <aside id="route-details">
        <p>Деталі обраного маршруту</p>
      </aside>
    </main>

    <footer>
      <p>Авторство: Пазюра Кирило ІП-54</p>
    </footer>
  </body>
</html>
